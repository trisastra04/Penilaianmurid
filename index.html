<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesmen Profil Pelajar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- APLIKASI UTAMA -->
  <div id="app" class="py-8 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto w-full flex-grow flex flex-col justify-center">
    
    <!-- ==================== HALAMAN LOGIN ==================== -->
    <div id="login-screen" class="w-full max-w-md mx-auto">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
        <div class="flex justify-center mb-6 text-indigo-600">
          <i data-lucide="graduation-cap" class="w-20 h-20"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Asesmen Profil Pelajar</h1>
        <p class="text-slate-600 text-sm sm:text-base mb-8">Silakan masukkan data diri untuk memulai.</p>

        <div class="space-y-5 text-left">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
            <select id="student-class" disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white disabled:bg-slate-100 disabled:text-slate-400">
              <option value="">Memuat data kelas...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
            <select id="student-name" disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white disabled:bg-slate-100 disabled:text-slate-400">
              <option value="">Pilih Kelas terlebih dahulu</option>
            </select>
          </div>
        </div>

        <button id="start-btn" disabled class="mt-8 w-full inline-flex items-center justify-center px-6 py-3.5 rounded-xl text-lg font-bold transition-all bg-slate-100 text-slate-400 cursor-not-allowed">
          Mulai Asesmen
          <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
        </button>
      </div>
    </div>

    <!-- ==================== HALAMAN KUESIONER ==================== -->
    <div id="question-screen" class="hidden">
      <!-- Header Info Singkat -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 text-center sm:text-left">
          Asesmen Profil Pelajar
        </h1>
        <div class="inline-flex items-center text-sm font-medium text-slate-600 bg-slate-100 px-4 py-2 rounded-full">
          <i data-lucide="user" class="w-4 h-4 mr-2"></i> <span id="display-name" class="mr-2"></span>
          <span class="text-slate-300 mr-2">|</span>
          <span id="display-class"></span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="sticky top-4 z-10 bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200 p-4 mb-8 flex justify-between items-center">
        <span class="text-sm font-medium text-slate-600 hidden sm:inline">Progres:</span>
        <div class="flex-1 sm:mx-4 mr-4">
          <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-300 ease-out" style="width: 0%"></div>
          </div>
        </div>
        <span id="progress-text" class="text-sm font-bold text-indigo-600">0 / 25</span>
      </div>

      <!-- List Pertanyaan -->
      <div id="questions-container" class="space-y-6">
        <!-- Pertanyaan akan dirender menggunakan JavaScript di sini -->
      </div>

      <!-- Submit Section -->
      <div class="mt-8 mb-20 text-center bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <p id="submit-msg" class="text-amber-600 mb-4 text-sm font-medium">Masih ada pertanyaan yang belum dijawab.</p>
        <button id="submit-btn" disabled class="inline-flex items-center justify-center px-8 py-4 rounded-xl text-lg font-bold transition-all w-full sm:w-auto bg-slate-100 text-slate-400 cursor-not-allowed">
          Lihat Hasil Asesmen
          <i data-lucide="chevron-right" class="w-5 h-5 ml-2"></i>
        </button>
      </div>
    </div>

    <!-- ==================== HALAMAN HASIL ==================== -->
    <div id="result-screen" class="hidden space-y-6 max-w-2xl mx-auto w-full">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 text-center">
        <div class="flex justify-center mb-4 text-indigo-600">
          <i data-lucide="brain-circuit" class="w-16 h-16"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Profil Karakter & Belajar</h1>
        <div class="inline-flex items-center justify-center flex-wrap gap-2 text-slate-600 bg-slate-100 px-4 py-2 rounded-full mt-2 text-sm sm:text-base">
          <span class="flex items-center"><i data-lucide="user" class="w-4 h-4 mr-2"></i> <span id="res-name"></span></span>
          <span class="hidden sm:inline text-slate-300">|</span>
          <span class="flex items-center"><i data-lucide="book-open" class="w-4 h-4 mr-2"></i> Kelas <span id="res-class"></span></span>
        </div>
        <p class="mt-6 text-sm text-amber-600 bg-amber-50 p-3 rounded-lg border border-amber-100">
          *Detail analisis dan tips telah otomatis dikirimkan kepada Guru Bimbingan Konseling / Wali Kelasmu.
        </p>
      </div>

      <div id="result-cards-container" class="space-y-6">
        <!-- Kartu Hasil dirender di sini -->
      </div>

      <div class="text-center pt-8 pb-12">
        <button onclick="resetTest()" class="inline-flex items-center justify-center px-6 py-3 bg-slate-800 text-white font-medium rounded-xl hover:bg-slate-700 transition-colors w-full sm:w-auto">
          <i data-lucide="rotate-ccw" class="w-5 h-5 mr-2"></i> Selesai / Siswa Berikutnya
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- DATA KUESIONER ---

      { id: 'v2', question: "Saat harus menghafal banyak istilah asing atau rumus untuk ujian, apa yang biasa kamu lakukan?", options: [{ id: 'A', text: "Membayangkan letak rumus tersebut di buku catatan atau menandainya dengan stabilo warna-warni." }, { id: 'B', text: "Membaca rumus atau istilah tersebut berulang-ulang dengan suara keras/bergumam." }, { id: 'C', text: "Menulis ulang rumus atau istilah tersebut berkali-kali di kertas coretan." }] },

      { id: 'v4', question: "Saat sedang mengerjakan soal UTBK atau Ujian Sekolah, bagaimana caramu mengingat materi yang sudah dipelajari?", options: [{ id: 'A', text: "Mengingat halaman buku, posisi diagram, atau tulisan tangan di catatanmu." }, { id: 'B', text: "Mengingat kembali suara atau ucapan guru/tutor saat menjelaskan materi tersebut." }, { id: 'C', text: "Mengingat gerakan tangan saat mencatat atau aktivitas praktikum di lab." }] },

      { id: 'v9', question: "Di SMA, gaya belajar atau jenis tugas seperti apa yang paling kamu sukai?", options: [{ id: 'A', text: "Membuat presentasi PowerPoint yang estetik, poster, atau tugas desain." }, { id: 'B', text: "Diskusi kelompok, presentasi lisan, debat, atau tugas wawancara." }, { id: 'C', text: "Praktikum di laboratorium kimia/biologi, olahraga, atau membuat proyek karya nyata." }] },
      { id: 'v10', question: "Saat kenalan dengan teman beda kelas atau sekolah, hal apa yang paling mudah menempel di ingatanmu?", options: [{ id: 'A', text: "Wajahnya, penampilannya, atau gaya pakaiannya (tapi kadang lupa namanya)." }, { id: 'B', text: "Namanya atau gaya bicaranya (tapi kadang lupa wajahnya)." }, { id: 'C', text: "Kegiatan yang kalian lakukan saat bertemu (misal: pernah satu tim ekskul basket)." }] },

    const temperamentQuestions = [
      { id: 't1', question: "Saat ada kerja kelompok (project base) yang rumit, peran apa yang biasanya otomatis kamu ambil?", options: [{ id: 'A', text: "Pencair suasana. Aku banyak ide dan bikin asyik, meski kadang ceroboh soal teknis." }, { id: 'B', text: "Leader (Ketua). Aku suka membagi tugas, set deadline, dan memastikan semua kerja." }, { id: 'C', text: "Si Pemikir. Aku fokus mengerjakan bagianku dengan sangat detail, rapi, dan sempurna." }, { id: 'D', text: "Pengikut setia. Aku kerjakan apa saja yang disuruh asal kelompok aman dan nggak ada ribut." }] },

      { id: 't3', question: "Teguran atau kelemahan yang paling sering kamu dengar dari teman sekelasmu adalah...", options: [{ id: 'A', text: "'Kamu itu berisik banget, pecicilan, ceroboh, dan susah serius!'" }, { id: 'B', text: "'Kamu terlalu bossy (suka nyuruh-nyuruh), keras kepala, dan nggak sabaran!'" }, { id: 'C', text: "'Kamu terlalu perfeksionis, kaku, baperan, dan gampang overthinking!'" }, { id: 'D', text: "'Kamu terlalu lelet, cuek, dan kalau ditanya jawabnya 'terserah' melulu!'" }] },

        title: 'Kepribadian Tipe A', icon: 'zap', iconColor: 'text-rose-500', color: 'bg-rose-100 text-rose-800 border-rose-300', 
        characteristics: "Ambisious, sangat kompetitif, terburu-buru, dan rentan terhadap stres kerja.", 
        tips: "Ajarkan manajemen stres, relaksasi, dan bahwa kegagalan/kekalahan adalah hal wajar dalam belajar.",
        advising: "Ingatkan ia untuk tidak terlalu keras pada diri sendiri. Bantu ia menurunkan standar kesempurnaannya agar tidak mudah tertekan, dan arahkan untuk menghargai 'proses'."
      },
      'AB_B': { 
        title: 'Kepribadian Tipe B', icon: 'coffee', iconColor: 'text-teal-500', color: 'bg-teal-100 text-teal-800 border-teal-300', 
        characteristics: "Santai, sabar, easy-going, dan kurang kompetitif.", 
        tips: "Berikan deadline yang lebih ketat namun fleksibel agar mereka tidak terlalu bersantai/menunda pekerjaan.",
        advising: "Tegaskan pentingnya kedisiplinan dan jelaskan konsekuensi jika menunda tugas, namun tetap gunakan intonasi yang membangun dan memotivasi."
      }
    };

    const allQuestions = [...vakQuestions, ...temperamentQuestions, ...typeABQuestions];
    const totalQuestions = allQuestions.length;
    
    // APP STATE
    let answers = {};
    let studentName = '';
    let studentClass = '';
    let studentsData = {}; // Menyimpan data dari CSV

    // GOOGLE SCRIPT & CSV URL
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzI0CVW4sce1UmJKLdTNHyPcXUYxdlMbo6LMZVngfcNWo-3LYJIPe-habxJN8FsnP9h/exec'; 
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3yfqmevoPCGaR100sZE9w_EDWuFyNIMVarzKzABw-RAyUYm8I6nJTlWpvtPYk-07afaotGnM7sKwY/pub?gid=894866630&single=true&output=csv';

    // DOM Elements
    const loginScreen = document.getElementById('login-screen');
    const questionScreen = document.getElementById('question-screen');
    const resultScreen = document.getElementById('result-screen');
    
    const inputName = document.getElementById('student-name');
    const inputClass = document.getElementById('student-class');
    const startBtn = document.getElementById('start-btn');
    
    const displayName = document.getElementById('display-name');
    const displayClass = document.getElementById('display-class');
    
    const qContainer = document.getElementById('questions-container');
    const submitBtn = document.getElementById('submit-btn');
    const submitMsg = document.getElementById('submit-msg');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    // Fungsi Parser CSV sederhana
    function parseCSV(str) {
      const arr = [];
      let quote = false;
      let row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    // Fetch data siswa dari CSV
    async function loadStudentData() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if(rows.length > 0) {
          const headers = rows[0].map(h => h.trim()).filter(h => h);
          headers.forEach(h => studentsData[h] = []);

          for(let i = 1; i < rows.length; i++) {
            headers.forEach((h, index) => {
              if(rows[i][index] && rows[i][index].trim() !== '') {
                studentsData[h].push(rows[i][index].trim());
              }
            });
          }

          // Urutkan nama abjad
          Object.keys(studentsData).forEach(k => studentsData[k].sort());

          // Populate Kelas Dropdown
          inputClass.innerHTML = '<option value="">-- Pilih Kelas --</option>';
          headers.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h;
            opt.textContent = h;
            inputClass.appendChild(opt);
          });
          inputClass.disabled = false;
        }
      } catch (error) {
        console.error("Error loading CSV:", error);
        inputClass.innerHTML = '<option value="">Gagal memuat data kelas</option>';
      }
    }

    // Initialize UI
    function init() {
      // Muat data dari CSV
      loadStudentData();

      // Render questions
      qContainer.innerHTML = '';
      allQuestions.forEach(q => {
        const qDiv = document.createElement('div');
        qDiv.id = `q-${q.id}`;
        qDiv.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 transition-all hover:shadow-md";
        
        let optionsHtml = '';
        q.options.forEach(opt => {
          optionsHtml += `
            <button onclick="handleAnswer('${q.id}', '${opt.id}')" data-opt="${opt.id}" class="w-full flex items-center p-4 rounded-xl border-2 text-left transition-all border-slate-100 bg-slate-50 text-slate-700 hover:border-indigo-200 hover:bg-slate-100">
              <div class="check-circle flex-shrink-0 w-6 h-6 rounded-full border-2 mr-4 flex items-center justify-center border-slate-300">
                <div class="inner-dot w-3 h-3 rounded-full bg-indigo-500 hidden"></div>
              </div>
              <span class="flex-1">${opt.text}</span>
            </button>
          `;
        });

        qDiv.innerHTML = `
          <h3 class="text-lg font-medium text-slate-800 mb-4">${q.question}</h3>
          <div class="space-y-3">
            ${optionsHtml}
          </div>
        `;
        qContainer.appendChild(qDiv);
      });

      // Login Screen Listeners
      inputClass.addEventListener('change', function() {
        studentClass = this.value;
        studentName = '';
        
        // Reset dropdown nama
        inputName.innerHTML = '<option value="">-- Pilih Nama --</option>';
        
        if (studentClass && studentsData[studentClass]) {
          inputName.disabled = false;
          studentsData[studentClass].forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            inputName.appendChild(opt);
          });
        } else {
          inputName.disabled = true;
          inputName.innerHTML = '<option value="">Pilih Kelas terlebih dahulu</option>';
        }
        checkLoginInput();
      });

      inputName.addEventListener('change', function() {
        studentName = this.value;
        checkLoginInput();
      });
      
      startBtn.addEventListener('click', startAssessment);

      // Submit listener
      submitBtn.addEventListener('click', calculateResults);

      // Initialize icons
      lucide.createIcons();
    }

    // Validasi input di halaman Login
    function checkLoginInput() {
      studentName = inputName.value;
      studentClass = inputClass.value;
      
      if (studentName.trim() !== '' && studentClass.trim() !== '') {
        startBtn.disabled = false;
        startBtn.className = "mt-8 w-full inline-flex items-center justify-center px-6 py-3.5 rounded-xl text-lg font-bold transition-all bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-lg hover:-translate-y-0.5";
      } else {
        startBtn.disabled = true;
        startBtn.className = "mt-8 w-full inline-flex items-center justify-center px-6 py-3.5 rounded-xl text-lg font-bold transition-all bg-slate-100 text-slate-400 cursor-not-allowed";
      }
    }

    // Mulai Asesmen
    function startAssessment() {
      loginScreen.classList.add('hidden');
      questionScreen.classList.remove('hidden');
      
      // Update display nama dan kelas di header soal
      displayName.innerText = studentName;
      displayClass.innerText = studentClass;
      
      window.scrollTo(0, 0);
    }

    // Handle answer selection
    function handleAnswer(questionId, optionId) {
      answers[questionId] = optionId;
      
      const qBlock = document.getElementById(`q-${questionId}`);
      const buttons = qBlock.querySelectorAll('button');
      
      buttons.forEach(btn => {
        const isSelected = btn.dataset.opt === optionId;
        const checkCircle = btn.querySelector('.check-circle');
        const innerDot = btn.querySelector('.inner-dot');
        
        if (isSelected) {
          btn.className = "w-full flex items-center p-4 rounded-xl border-2 text-left transition-all border-indigo-500 bg-indigo-50 text-indigo-900";
          checkCircle.className = "check-circle flex-shrink-0 w-6 h-6 rounded-full border-2 mr-4 flex items-center justify-center border-indigo-500";
          innerDot.classList.remove('hidden');
        } else {
          btn.className = "w-full flex items-center p-4 rounded-xl border-2 text-left transition-all border-slate-100 bg-slate-50 text-slate-700 hover:border-indigo-200 hover:bg-slate-100";
          checkCircle.className = "check-circle flex-shrink-0 w-6 h-6 rounded-full border-2 mr-4 flex items-center justify-center border-slate-300";
          innerDot.classList.add('hidden');
        }
      });

      updateProgress();
    }

    // Update progress bar and submit button
    function updateProgress() {
      const answeredCount = Object.keys(answers).length;
      progressBar.style.width = `${(answeredCount / totalQuestions) * 100}%`;
      progressText.innerText = `${answeredCount} / ${totalQuestions}`;

      const isComplete = answeredCount === totalQuestions;

      if (isComplete) {
        submitBtn.disabled = false;
        submitBtn.className = "inline-flex items-center justify-center px-8 py-4 rounded-xl text-lg font-bold transition-all w-full sm:w-auto bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-lg hover:-translate-y-0.5";
        submitMsg.classList.add('hidden');
      } else {
        submitBtn.disabled = true;
        submitBtn.className = "inline-flex items-center justify-center px-8 py-4 rounded-xl text-lg font-bold transition-all w-full sm:w-auto bg-slate-100 text-slate-400 cursor-not-allowed";
        submitMsg.classList.remove('hidden');
        submitMsg.innerText = `Masih ada ${totalQuestions - answeredCount} pertanyaan yang belum dijawab.`;
      }
    }

    // Calculate Results and Submit
    async function calculateResults() {
      // Show loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Menyimpan & Menganalisis Data...';
      submitBtn.className = "inline-flex items-center justify-center px-8 py-4 rounded-xl text-lg font-bold transition-all w-full sm:w-auto bg-indigo-400 text-white cursor-wait";

      // 1. Hitung Skor VAK
      const scoresVAK = { A: 0, B: 0, C: 0 };
      vakQuestions.forEach(q => { if (answers[q.id]) scoresVAK[answers[q.id]]++; });
      const maxVAK = Math.max(scoresVAK.A, scoresVAK.B, scoresVAK.C);
      const domVAK = [];
      if (scoresVAK.A === maxVAK) domVAK.push('VAK_A');
      if (scoresVAK.B === maxVAK) domVAK.push('VAK_B');
      if (scoresVAK.C === maxVAK) domVAK.push('VAK_C');

      // 2. Hitung Skor Temperament
      const scoresTemp = { A: 0, B: 0, C: 0, D: 0 };
      temperamentQuestions.forEach(q => { if (answers[q.id]) scoresTemp[answers[q.id]]++; });
      const maxTemp = Math.max(scoresTemp.A, scoresTemp.B, scoresTemp.C, scoresTemp.D);
      const domTemp = [];
      if (scoresTemp.A === maxTemp) domTemp.push('TEMP_A');
      if (scoresTemp.B === maxTemp) domTemp.push('TEMP_B');
      if (scoresTemp.C === maxTemp) domTemp.push('TEMP_C');
      if (scoresTemp.D === maxTemp) domTemp.push('TEMP_D');

      // 3. Hitung Skor Tipe A/B
      const scoresAB = { A: 0, B: 0 };
      typeABQuestions.forEach(q => { if (answers[q.id]) scoresAB[answers[q.id]]++; });
      const maxAB = Math.max(scoresAB.A, scoresAB.B);
      const domAB = [];
      if (scoresAB.A === maxAB) domAB.push('AB_A');
      if (scoresAB.B === maxAB) domAB.push('AB_B');

      // Helper function compileData
      const compileData = (domArray) => ({
        titles: domArray.map(id => guideData[id].title).join(' / '),
        chars: domArray.map(id => guideData[id].characteristics).join(' | '),
        tips: domArray.map(id => guideData[id].tips).join(' | '),
        advising: domArray.map(id => guideData[id].advising).join(' | ')
      });

      const vakData = compileData(domVAK);
      const tempData = compileData(domTemp);
      const abData = compileData(domAB);

      const kesimpulanAkhir = `PROFIL: ${studentName} memiliki gaya belajar dominan ${vakData.titles} (${vakData.chars}). Secara kepribadian, ia cenderung ${tempData.titles} (${tempData.chars}). Terkait respon stres, ia menunjukkan ${abData.titles} (${abData.chars}).\n\nTIPS MENGAJAR: ${vakData.tips} ${tempData.tips} ${abData.tips}\n\nTIPS MENASEHATI: ${tempData.advising} ${abData.advising} ${vakData.advising}`;

      // Kirim Data ke Google Spreadsheet
      if (GOOGLE_SCRIPT_URL) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nama: studentName,
              kelas: studentClass,
              vak_visual: scoresVAK.A, vak_auditori: scoresVAK.B, vak_kinestetik: scoresVAK.C,
              vak_dominan: vakData.titles, vak_karakteristik: vakData.chars, vak_tips: vakData.tips,
              temp_sanguinis: scoresTemp.A, temp_koleris: scoresTemp.B, temp_melankolis: scoresTemp.C, temp_plegmatis: scoresTemp.D,
              temp_dominan: tempData.titles, temp_karakteristik: tempData.chars, temp_tips: tempData.tips,
              ab_tipea: scoresAB.A, ab_tipeb: scoresAB.B,
              ab_dominan: abData.titles, ab_karakteristik: abData.chars, ab_tips: abData.tips,
              kesimpulan_akhir: kesimpulanAkhir
            })
          });
        } catch (error) {
          console.error("Gagal mengirim data:", error);
        }
      }

      showResultsUI(domVAK, domTemp, domAB);
    }

    // Render results in UI
    function showResultsUI(domVAK, domTemp, domAB) {
      questionScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      window.scrollTo(0, 0);

      document.getElementById('res-name').innerText = studentName;
      document.getElementById('res-class').innerText = studentClass;

      const resultsContainer = document.getElementById('result-cards-container');
      resultsContainer.innerHTML = '';

      renderResultCard("GAYA BELAJAR UTAMA", domVAK, resultsContainer);
      renderResultCard("TIPE KEPRIBADIAN KLASIK", domTemp, resultsContainer);
      renderResultCard("GAYA RESPON STRES (Tipe A/B)", domAB, resultsContainer);

      lucide.createIcons();
    }

    function renderResultCard(title, domArray, container) {
      let cardsHtml = domArray.map(styleId => {
        const style = guideData[styleId];
        return `
          <div class="rounded-2xl border p-6 ${style.color} bg-opacity-30 flex items-center justify-center space-x-4">
            <div class="bg-white p-3 rounded-xl shadow-sm">
              <i data-lucide="${style.icon}" class="w-8 h-8 ${style.iconColor}"></i>
            </div>
            <div class="text-center sm:text-left">
              <h3 class="text-2xl font-bold">${style.title}</h3>
              ${domArray.length > 1 ? '<span class="text-xs font-medium opacity-75">(Kombinasi)</span>' : ''}
            </div>
          </div>
        `;
      }).join('');

      container.insertAdjacentHTML('beforeend', `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-6">
          <h2 class="text-lg font-semibold text-slate-500 mb-4 text-center">${title}</h2>
          <div class="space-y-4">
            ${cardsHtml}
          </div>
        </div>
      `);
    }

    // Reset Test
    function resetTest() {
      answers = {};
      studentName = '';
      studentClass = '';
      inputClass.value = '';
      
      inputName.innerHTML = '<option value="">Pilih Kelas terlebih dahulu</option>';
      inputName.disabled = true;
      inputName.value = '';
      
      checkLoginInput(); // Reset start button state
      
      resultScreen.classList.add('hidden');
      questionScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      
      // Reset buttons state
      submitBtn.innerHTML = `Lihat Hasil Asesmen <i data-lucide="chevron-right" class="w-5 h-5 ml-2"></i>`;
      
      init(); // Re-render questions cleanly
      updateProgress();
      window.scrollTo(0, 0);
    }

    // Start App
    init();
  </script>
</body>
</html>
